name: Normalize OG image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/normalize-og-image.yml"
      - "assets/images/social/portfolio-og-clean-20261002.jpg"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: python -m pip install pillow

      - name: Create exact 1200x630 OG image
        run: |
          python - <<'PY'
          from PIL import Image

          src = Image.open("assets/images/social/portfolio-og-clean-20261002.jpg").convert("RGB")
          target_w, target_h = 1200, 630

          scale = min(target_w / src.width, target_h / src.height)
          resized = src.resize(
              (round(src.width * scale), round(src.height * scale)),
              Image.Resampling.LANCZOS,
          )

          canvas = Image.new("RGB", (target_w, target_h), "white")
          x = (target_w - resized.width) // 2
          y = (target_h - resized.height) // 2
          canvas.paste(resized, (x, y))

          canvas.save(
              "assets/images/social/portfolio-og-clean-1200x630-v2.jpg",
              "JPEG",
              quality=88,
              optimize=True,
              progressive=True,
          )
          print("saved:", canvas.size, "source:", src.size, "placed:", resized.size, "offset:", (x, y))
          PY

      - name: Commit normalized image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/social/portfolio-og-clean-1200x630-v2.jpg
          git diff --cached --quiet && exit 0
          git commit -m "fix: normalize portfolio OG image dimensions"
          git push
